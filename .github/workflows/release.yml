name: Release

# On every push to main, Changesets either opens/updates the "Version Packages" pull request
# (when there are changesets) or publishes the versions that are not on npm yet (after that pull
# request is merged). Publishing uses npm Trusted Publishing: no npm token is stored. See
# RELEASING.md.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
